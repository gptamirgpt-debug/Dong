name: Build AmirDong APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          set -e
          test -f dong.html
          P=android
          mkdir -p $P/app/src/main/java/com/amir/dong $P/app/src/main/assets/fonts $P/app/src/main/res/values $P/app/src/main/res/drawable-nodpi $P/app/src/main/res/mipmap-anydpi-v26

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Dong"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.amir.dong'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.amir.dong'
                  minSdk 26
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('RUN_NUMBER') ?: '1')
                  versionName '1.0'
              }

              signingConfigs {
                  dong {
                      storeFile file('dong.keystore')
                      storePassword 'dongpass123'
                      keyAlias 'dong'
                      keyPassword 'dongpass123'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.dong
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          echo '' | base64 -d > $P/app/dong.keystore

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:allowBackup="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/java/com/amir/dong/MainActivity.java <<'EOF'
          package com.amir.dong;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(false);
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AmirDong</string>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_bg">#0E2B2A</color>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0B7A75</item>
                  <item name="android:navigationBarColor">#0B7A75</item>
                  <item name="android:windowBackground">#0B7A75</item>
              </style>
          </resources>
          EOF

          echo '' | base64 -d > $P/app/src/main/res/drawable-nodpi/ic_fg.png

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

      - name: Bundle the web app with offline fonts
        run: |
          python3 - <<'PY'
          import re, urllib.request

          ua = 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36'
          assets = 'android/app/src/main/assets/'

          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': ua}), timeout=60).read()

          css = get('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap').decode('utf-8')
          files = {}

          def rep(m):
              u = m.group(1)
              if u not in files:
                  fn = 'f%d.woff2' % (len(files) + 1)
                  open(assets + 'fonts/' + fn, 'wb').write(get(u))
                  files[u] = fn
              return 'url(fonts/%s)' % files[u]

          css = re.sub(r'url\((https://[^)]+)\)', rep, css)
          assert files, 'no fonts downloaded'
          open(assets + 'fonts.css', 'w', encoding='utf-8').write(css)

          h = open('dong.html', encoding='utf-8').read()
          h, n = re.subn(r'<link[^>]*fonts\.googleapis\.com[^>]*>', '<link rel="stylesheet" href="fonts.css">', h)
          assert n == 1, 'font link not found in dong.html'
          head = ('<!doctype html>\n<html lang="fa" dir="rtl">\n<head>\n<meta charset="utf-8">\n'
                  '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
                  '<style>html{color-scheme:light}body{margin:0}</style>\n')
          open(assets + 'index.html', 'w', encoding='utf-8').write(head + h + '\n</html>\n')
          print('fonts:', len(files))
          PY

      - name: Build APK
        working-directory: android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmirDong-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AmirDong.apk
          gh release create "apk-${{ github.run_number }}" AmirDong.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "AmirDong ${{ github.run_number }}" --notes "AmirDong APK" --latest
